
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite - Stranger Things</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: #000;
        color: #fff;
        text-align: center;
    }
    .container { padding: 20px; }
    h1 {
        color: #e50914;
        font-size: 2.5rem;
        text-shadow: 0 0 10px #e50914;
    }
    .card {
        background: rgba(20,20,20,0.9);
        border: 2px solid #e50914;
        border-radius: 12px;
        padding: 20px;
        max-width: 600px;
        margin: auto;
        box-shadow: 0 0 20px #e50914;
    }
    p { font-size: 1.2rem; line-height: 1.6rem; }
    .banner {
        width: 100%;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 0 15px #e50914;
    }
    .emoji { font-size: 1.8rem; }
</style>
</head>
<body>

<div class="container">
    <img class="banner" src="https://wallpapercave.com/wp/wp1917154.jpg">
    <div class="card">
        <h1>Convite Especial ❤️‍🔥</h1>
        <p class="emoji">✨🍿🎬</p>
        <p>No dia <b>26</b>, às <b>22h</b>, te convido para vir à minha casa assistir comigo<br>
        <span style="color:#e50914;font-weight:bold;">STRANGER THINGS</span> 👀🔦</p>
        <p>Quero uma noite romântica, divertida, cheia de risadas e sustos…<br>
        <i>do jeitinho que a gente gosta</i> ❤️🔥</p>
        <p class="emoji">🖤❤️🌹</p>
        <p>Te espero no mundo invertido...<br>
        ou melhor, aqui em casa 😏✨</p>
    </div>
</div>

</body>
</html>
